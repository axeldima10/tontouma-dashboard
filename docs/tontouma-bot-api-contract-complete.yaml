openapi: 3.0.3
info:
  title: Tontouma Bot — API complète (Backend Spring)
  version: 1.0.0
  description: Contrat complet de l'application. Voir aussi tontouma-bot-priority-us-contract.yaml pour le sous-ensemble des 5 US prioritaires.
servers:
- url: https://api.tontoumabot.sn/api/v1
  description: Production (à confirmer)
- url: http://localhost:8080/api/v1
  description: Développement local
security:
- clerkAuth: []
components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Header: Authorization: Bearer <token Clerk>. Absent sur /public/... et /access-ticket.'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clerk_org_id:
          type: string
        nom:
          type: string
        type:
          type: string
        description:
          type: string
        adresse:
          type: string
        telephone:
          type: string
        email:
          type: string
        siteWeb:
          type: string
        logo_url:
          type: string
          format: uri
          nullable: true
        statut:
          type: string
          enum:
          - active
          - suspendue
        dateCreation:
          type: string
          format: date-time
    DemandeAccesOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nomOrganisation:
          type: string
        emailContact:
          type: string
        telephoneContact:
          type: string
        message:
          type: string
        statut:
          type: string
          enum:
          - en_attente
          - approuvee
          - rejetee
        dateDemande:
          type: string
          format: date-time
    InvitationOrganisation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
        email:
          type: string
        token:
          type: string
        statut:
          type: string
          enum:
          - envoyee
          - acceptee
          - expiree
        dateExpiration:
          type: string
          format: date-time
    AuthenticatedUser:
      type: object
      properties:
        clerk_user_id:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
        organization:
          $ref: '#/components/schemas/Organization'
    AccessResolution:
      type: object
      properties:
        session_id:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
    Departement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        ordre:
          type: integer
        statut:
          type: string
          enum:
          - actif
          - inactif
    ServiceOffering:
      type: object
      properties:
        id:
          type: string
          format: uuid
        departement_id:
          type: string
          format: uuid
          nullable: true
        organization_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        localisation:
          type: string
        telephone:
          type: string
        email:
          type: string
        horaires:
          type: string
        description_orientation:
          type: string
          nullable: true
          example: Couloir central, première porte à droite
        ordre:
          type: integer
        statut_publication:
          type: string
          enum:
          - brouillon
          - publie
    Procedure:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        cout:
          type: string
          nullable: true
        delai:
          type: string
          nullable: true
        lieu:
          type: string
          nullable: true
        infoComplementaire:
          type: string
          nullable: true
        ordre:
          type: integer
        statut:
          type: string
          enum:
          - brouillon
          - publie
    ConditionDemarche:
      type: object
      properties:
        id:
          type: string
          format: uuid
        procedure_id:
          type: string
          format: uuid
        description:
          type: string
        ordre:
          type: integer
    PieceRequise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        procedure_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        nombreExemplaire:
          type: integer
        format:
          type: string
          nullable: true
        obligatoire:
          type: boolean
        ordre:
          type: integer
    Formulaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
        procedure_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        actif:
          type: boolean
        statut:
          type: string
          enum:
          - brouillon
          - publie
    SectionFormulaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formulaire_id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        ordre:
          type: integer
    ChampFormulaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
        section_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - texte
          - nombre
          - date
          - select
          - checkbox
          - fichier
        nom:
          type: string
        etiquette:
          type: string
        placeholder:
          type: string
          nullable: true
        obligatoire:
          type: boolean
        valeurParDefaut:
          type: string
          nullable: true
        options:
          type: object
          nullable: true
        ordre:
          type: integer
    FormulaireSubmission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formulaire_id:
          type: string
          format: uuid
        session_id:
          type: string
        reponses:
          type: object
        qr_recapitulatif_token:
          type: string
          description: Scanné par l'agent au guichet pour récupérer les réponses sans ressaisie
        dateSoumission:
          type: string
          format: date-time
    DocumentConnaissance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
          nullable: true
        procedure_id:
          type: string
          format: uuid
          nullable: true
        titre:
          type: string
        type:
          type: string
        description:
          type: string
        categorie:
          type: string
          nullable: true
        fichierUrl:
          type: string
          format: uri
        statutIndexation:
          type: string
          enum:
          - en_attente
          - en_cours
          - indexe
          - erreur
    PlanBatiment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        nom:
          type: string
          example: Rez-de-chaussée
        image_url:
          type: string
          format: uri
    Position:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        entite_type:
          type: string
          enum:
          - borne
          - service
        entite_id:
          type: string
          format: uuid
        coordonnee_x:
          type: number
        coordonnee_y:
          type: number
    Borne:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        codeUnique:
          type: string
        nom:
          type: string
        localisation:
          type: string
        statut:
          type: string
          enum:
          - active
          - inactive
          - maintenance
        versionLogicielle:
          type: string
          nullable: true
    QRCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        borne_id:
          type: string
          format: uuid
          nullable: true
        organization_id:
          type: string
          format: uuid
          nullable: true
        code:
          type: string
        url:
          type: string
          format: uri
        type:
          type: string
          enum:
          - organisation
          - service
          - demarche
        actif:
          type: boolean
        dateExpiration:
          type: string
          format: date-time
          nullable: true
    PlanAbonnement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
        devise:
          type: string
        periode:
          type: string
          enum:
          - mensuel
          - trimestriel
          - annuel
        limiteUtilisateurs:
          type: integer
        limiteBornes:
          type: integer
        limiteStockage:
          type: integer
        fonctionnalites:
          type: object
        statut:
          type: string
          enum:
          - actif
          - inactif
    Abonnement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        statut:
          type: string
          enum:
          - active
          - expiree
          - suspendue
        dateDebut:
          type: string
          format: date-time
        dateFin:
          type: string
          format: date-time
        prochainRenouvellement:
          type: string
          format: date-time
        modeRenouvellement:
          type: string
          enum:
          - automatique
          - manuel
        montant:
          type: number
        devise:
          type: string
    HistoriqueAbonnement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        abonnement_id:
          type: string
          format: uuid
        statut:
          type: string
        ancienneDateFin:
          type: string
          format: date-time
        nouvelleDateFin:
          type: string
          format: date-time
        motif:
          type: string
        dateAction:
          type: string
          format: date-time
        effectuePar:
          type: string
    Facture:
      type: object
      properties:
        id:
          type: string
          format: uuid
        abonnement_id:
          type: string
          format: uuid
        numero:
          type: string
        dateEmission:
          type: string
          format: date-time
        dateEcheance:
          type: string
          format: date-time
        montant:
          type: number
        devise:
          type: string
        statut:
          type: string
          enum:
          - brouillon
          - emise
          - payee
          - en_retard
          - annulee
        fichierPDF:
          type: string
          format: uri
          nullable: true
    TransactionPaiement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        abonnement_id:
          type: string
          format: uuid
        reference:
          type: string
        montant:
          type: number
        devise:
          type: string
        methode:
          type: string
          enum:
          - orange_money
          - wave
        statut:
          type: string
          enum:
          - reussi
          - echoue
          - en_attente
        datePaiement:
          type: string
          format: date-time
          nullable: true
    RappelAbonnement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        abonnement_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - rappel_expiration
          - rappel_paiement
          - renouvellement_information
        canal:
          type: string
          enum:
          - email
          - sms
          - inapp
        dateEnvoi:
          type: string
          format: date-time
        statut:
          type: string
          enum:
          - envoye
          - en_attente
          - echoue
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        canal:
          type: string
          enum:
          - texte
          - voix
        dateDebut:
          type: string
          format: date-time
        dateFin:
          type: string
          format: date-time
        resume:
          type: string
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
        contenu:
          type: string
        dateCreation:
          type: string
          format: date-time
paths:
  /admin/organizations:
    get:
      summary: Liste — Organization
      tags:
      - Admin - Organisations
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
        '401': &id002
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - clerkAuth: []
  /admin/organizations/{id}:
    get:
      summary: Détail — Organization
      tags:
      - Admin - Organisations
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404': &id003
          description: Introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - clerkAuth: []
    patch:
      summary: Met à jour — Organization
      tags:
      - Admin - Organisations
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': *id002
        '403': &id004
          description: Rôle insuffisant / organisation non autorisée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404': *id003
      security:
      - clerkAuth: []
    delete:
      summary: Supprime — Organization
      tags:
      - Admin - Organisations
      parameters:
      - *id001
      responses:
        '204':
          description: Supprimé
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
  /admin/demandes-acces:
    get:
      summary: Liste — DemandeAccesOrganisation
      tags:
      - Admin - Demandes d'accès
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DemandeAccesOrganisation'
        '401': *id002
      security:
      - clerkAuth: []
  /admin/demandes-acces/{id}:
    get:
      summary: Détail — DemandeAccesOrganisation
      tags:
      - Admin - Demandes d'accès
      parameters:
      - &id005
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAccesOrganisation'
        '404': *id003
      security:
      - clerkAuth: []
    patch:
      summary: Met à jour — DemandeAccesOrganisation
      tags:
      - Admin - Demandes d'accès
      parameters:
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandeAccesOrganisation'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandeAccesOrganisation'
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
  /admin/organizations/{id}/status:
    patch:
      summary: Suspend / réactive une organisation
      tags:
      - Admin - Organisations
      security:
      - clerkAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                statut:
                  type: string
                  enum:
                  - active
                  - suspendue
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403': *id004
  /admin/plans:
    get:
      summary: Liste — PlanAbonnement
      tags:
      - Admin - Plans
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlanAbonnement'
        '401': *id002
      security:
      - clerkAuth: []
    post:
      summary: Crée — PlanAbonnement
      tags:
      - Admin - Plans
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAbonnement'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAbonnement'
        '401': *id002
        '403': *id004
      security:
      - clerkAuth: []
  /admin/plans/{id}:
    get:
      summary: Détail — PlanAbonnement
      tags:
      - Admin - Plans
      parameters:
      - &id006
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAbonnement'
        '404': *id003
      security:
      - clerkAuth: []
    patch:
      summary: Met à jour — PlanAbonnement
      tags:
      - Admin - Plans
      parameters:
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanAbonnement'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAbonnement'
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
    delete:
      summary: Supprime — PlanAbonnement
      tags:
      - Admin - Plans
      parameters:
      - *id006
      responses:
        '204':
          description: Supprimé
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
  /organizations/{organizationId}/invitations:
    get:
      summary: Liste — InvitationOrganisation
      tags:
      - Organisations - Invitations
      parameters:
      - &id007
        name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InvitationOrganisation'
        '401': *id002
      security:
      - clerkAuth: []
    post:
      summary: Crée — InvitationOrganisation
      tags:
      - Organisations - Invitations
      parameters:
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationOrganisation'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOrganisation'
        '401': *id002
        '403': *id004
      security:
      - clerkAuth: []
  /organizations/{organizationId}/invitations/{id}:
    get:
      summary: Détail — InvitationOrganisation
      tags:
      - Organisations - Invitations
      parameters:
      - *id007
      - &id008
        name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOrganisation'
        '404': *id003
      security:
      - clerkAuth: []
    patch:
      summary: Met à jour — InvitationOrganisation
      tags:
      - Organisations - Invitations
      parameters:
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationOrganisation'
      responses:
        '200':
          description: Mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationOrganisation'
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
    delete:
      summary: Supprime — InvitationOrganisation
      tags:
      - Organisations - Invitations
      parameters:
      - *id007
      - *id008
      responses:
        '204':
          description: Supprimé
        '401': *id002
        '403': *id004
        '404': *id003
      security:
      - clerkAuth: []
  /organizations/{organizationId}/membres/invitations:
    post:
      summary: Invite un membre (vérifie limiteUtilisateurs du plan avant d'appeler Clerk)
      tags:
      - Organisations - Membres
      security:
      - clerkAuth: []
      parameters:
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum:
                  - super_admin
                  - admin
      responses:
        '201':
          description: Invitation envoyée via Clerk
        '409':
          description: Limite d'utilisateurs du plan atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id002
        '403': *id004
  /organizations/{organizationId}/subscription:
    get:
      summary: Consulte l'abonnement actif
      tags:
      - Abonnements
      security:
      - clerkAuth: []
      parameters:
      - *id007
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
        '401': *id002
  /organizations/{organizationId}/subscription/plan:
    get:
      summary: Consulte le plan actif et ses limites
      tags:
      - Abonnements
      security:
      - clerkAuth: []
      parameters:
      - *id007
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAbonnement'
        '401': *id002
  /organizations/{organizationId}/subscription/historique:
    get:
      summary: Liste — HistoriqueAbonnement
      tags:
